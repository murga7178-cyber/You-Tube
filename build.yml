name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # प्रोजेक्ट सीधे रखा हो तो वही, ज़िप में अपलोड हो तो उसे खोलकर
      - name: Find project
        id: p
        run: |
          if [ -f settings.gradle ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          else
            for z in *.zip; do [ -f "$z" ] && unzip -oq "$z" -d _zip; done
            d=$(dirname "$(find _zip -name settings.gradle | head -n1)")
            echo "dir=$d" >> $GITHUB_OUTPUT
          fi

      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-APK
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
