plugins {
    id 'com.android.application'
}

android {
    namespace 'com.videoplayer.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.videoplayer.app"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.unity3d.ads:unity-ads:4.20.0'
}
