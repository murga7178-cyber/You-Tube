<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-tap-highlight-color:transparent;font-family:sans-serif}
#wrap{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:#000}
#stage{position:relative;flex:1;min-height:0;background:#000}
#frame{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;z-index:1}
#player,#player iframe{position:absolute;left:0;top:-120px;width:100%;height:calc(100% + 240px);border:0;pointer-events:none}
#thumb{position:absolute;z-index:1;display:none;background:#000 center/cover no-repeat}
body.music #thumb{display:block}
#shield{position:absolute;left:0;top:0;width:100%;height:100%;z-index:2;touch-action:none}
#big{position:absolute;z-index:3;left:50%;top:50%;width:88px;height:88px;margin:-44px 0 0 -44px;border-radius:50%;background:#0b0b0b;color:#fff;font-size:36px;border:0;padding:0;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .2s}
#big.on{opacity:1;visibility:visible}
#msg{position:absolute;z-index:4;left:16px;right:16px;top:50%;transform:translateY(-50%);text-align:center;color:#fff;font-size:15px;line-height:1.5;display:none;background:rgba(0,0,0,.8);padding:14px;border-radius:12px}
#bar{flex:none;background:#0f0f0f;color:#fff;font-size:13px}
body.fs #bar{display:none;position:absolute;left:0;right:0;bottom:0;z-index:5;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.85))}
body.fs.ovl #bar{display:block}
body.mini #bar{display:none !important}
#r1,#r2{display:flex;align-items:center;gap:8px;padding:0 10px}
#r1{height:52px}
#r2{height:44px;justify-content:center;gap:16px}
#pp,#fs,#qbtn{background:none;border:0;color:#fff;font-size:22px;width:38px;height:38px;padding:0;flex:none}
#seek,#br{flex:1;min-width:0;height:30px;margin:0}
#seek{accent-color:#f00}
#bri{position:absolute;z-index:7;right:18px;top:50%;transform:translateY(-50%);width:46px;padding:10px 0;border-radius:23px;background:rgba(0,0,0,.65);color:#fff;display:none;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#bri.hint{opacity:.6}
#bsun{font-size:20px;line-height:1}
#btrack{position:relative;width:6px;height:120px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
#bfill{position:absolute;left:0;right:0;bottom:0;height:50%;background:#fff;border-radius:3px}
#bpct{font-size:12px}
#vol{position:absolute;z-index:7;left:18px;top:50%;transform:translateY(-50%);width:46px;padding:10px 0;border-radius:23px;background:rgba(0,0,0,.65);color:#fff;display:none;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#vol.hint{opacity:.6}
#vsp{font-size:20px;line-height:1}
#vtrack{position:relative;width:6px;height:120px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
#vfill{position:absolute;left:0;right:0;bottom:0;height:100%;background:#fff;border-radius:3px}
#vpct{font-size:12px}
#brw{position:absolute;right:12px;top:50%;width:40px;height:180px;margin-top:-90px;z-index:6;display:none}
#brw{display:none !important}
#br{position:absolute;width:160px;height:30px;left:-60px;top:75px;margin:0;transform:rotate(-90deg);accent-color:#fff}
#qmenu{position:absolute;z-index:8;right:10px;bottom:10px;min-width:150px;max-height:85%;overflow:auto;background:rgba(20,20,20,.96);border-radius:12px;padding:6px 0;display:none;color:#fff;font-size:14px}
body.fs #qmenu{bottom:72px}
body.mini #qmenu{display:none !important}
#qmenu .h{font-size:12px;color:#aaa;padding:8px 18px 4px}
#qmenu .q{padding:11px 18px;display:flex;justify-content:space-between;gap:18px}
#qmenu .q.cur{color:#ff4d4d;font-weight:bold}
.t{flex:none;min-width:92px;text-align:center}
.sk{background:#272727;border:0;color:#fff;border-radius:16px;height:32px;padding:0 12px;font-size:13px;flex:none}
.ic{flex:none;font-size:18px}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div id="frame"><div id="player"></div></div>
    <div id="thumb"></div>
    <div id="shield"></div>
    <button id="big"><svg viewBox="0 0 24 24" width="1em" height="1em"><path fill="#fff" d="M8 5v14l11-7z"/></svg></button>
    <div id="msg"></div>
    <div id="qmenu"></div>
    <div id="bri"><div id="bsun">&#9728;</div><div id="btrack"><div id="bfill"></div></div><div id="bpct">50%</div></div>
    <div id="vol"><div id="vsp">&#128266;</div><div id="vtrack"><div id="vfill"></div></div><div id="vpct">100%</div></div>
    <div id="brw"><input id="br" type="range" min="5" max="100" value="50"></div>
  </div>
  <div id="bar">
    <div id="r1">
      <button id="pp"><svg viewBox="0 0 24 24" width="1em" height="1em"><path fill="#fff" d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z"/></svg></button>
      <span class="t" id="tm">0:00 / 0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0">
      <button id="qbtn"><svg viewBox="0 0 24 24" width="1em" height="1em"><path fill="#fff" d="M19.14 12.94a7.1 7.1 0 0 0 .06-.94c0-.32-.02-.64-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.5.5 0 0 0-.59.22L2.74 8.87a.5.5 0 0 0 .12.64l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.12.22.37.3.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg></button>
      <button id="fs"><svg viewBox="0 0 24 24" width="1em" height="1em"><path fill="#fff" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
    </div>
  </div>
</div>
<script>
var VID = "__ID__", LST = "__LIST__", ST = __START__;
var ICON_PLAY = '<svg viewBox="0 0 24 24" width="1em" height="1em"><path fill="#fff" d="M8 5v14l11-7z"/></svg>', ICON_PAUSE = '<svg viewBox="0 0 24 24" width="1em" height="1em"><path fill="#fff" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
var p = null, dragging = false, mini = false, ovlTimer = null, flashUntil = 0;
function $(i) { return document.getElementById(i); }
function fmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), c = s % 60;
  return (h ? h + ":" + (m < 10 ? "0" : "") : "") + m + ":" + (c < 10 ? "0" : "") + c;
}

var tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

function onYouTubeIframeAPIReady() {
  var v = {
    autoplay: 1, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3,
    rel: 0, modestbranding: 1, playsinline: 1, cc_load_policy: 0,
    origin: "https://videoplayer.app"
  };
  if (ST > 0) v.start = ST;
  /* सिर्फ़ वही एक वीडियो चले: प्लेलिस्ट के आगे/पीछे वाले बटन न आएँ */
  if (LST && !VID) { v.list = LST; v.listType = "playlist"; }
  var o = {
    host: "https://www.youtube-nocookie.com",
    playerVars: v,
    events: { onReady: onReady, onStateChange: onState, onError: onError }
  };
  if (VID) o.videoId = VID;
  p = new YT.Player("player", o);
}

/* शील्ड को असली 16:9 वीडियो फ्रेम जितना बनाता है (काली पट्टी पर टैप नहीं चलेगा) */
function fitShield() {
  var st = $("stage"), W = st.clientWidth, H = st.clientHeight;
  if (!W || !H) return;
  var w = W, h = W * 9 / 16;
  if (h > H) { h = H; w = H * 16 / 9; }
  var s = $("shield").style;
  s.width = w + "px"; s.height = h + "px";
  s.left = ((W - w) / 2) + "px"; s.top = ((H - h) / 2) + "px";
  var th = $("thumb").style;
  th.width = w + "px"; th.height = h + "px"; th.left = s.left; th.top = s.top;
  var f = $("frame").style;
  f.width = w + "px"; f.height = h + "px";
  f.left = s.left; f.top = s.top;
  try { applyQSize(); } catch (e) {}
}
window.addEventListener("resize", function () { fitShield(); setTimeout(fitShield, 300); });
window.addEventListener("load", fitShield);
fitShield();

function onReady() {
  fitShield();
  if (window.Native) Native.ready();
  setInterval(tick, 250);
}

/* ---------- वीडियो के ऊपर सिर्फ़ बीच का एक बटन (टैप करने पर) ---------- */
function isPlaying() {
  if (!p || !p.getPlayerState) return false;
  var s = p.getPlayerState();
  return s === 1 || s === 3;
}
function showOvl(sticky) {
  if (mini) return;
  $("big").classList.add("on");
  document.body.classList.add("ovl");
  hintBri();
  hintVol();
  clearTimeout(ovlTimer);
  if (!sticky && isPlaying()) ovlTimer = setTimeout(hideOvl, 3000);
}
function hideOvl() {
  clearTimeout(ovlTimer);
  $("big").classList.remove("on");
  document.body.classList.remove("ovl");
  if (!bg || !bg.on) $("bri").style.display = "none";
  if (!vg || !vg.on) $("vol").style.display = "none";
}

/* ---------- म्यूज़िक मोड: वीडियो की जगह थंबनेल दिखे, सिर्फ़ गाना (आवाज़) बजे ---------- */
var music = false, thumbId = "";
function updateThumb() {
  if (!music) return;
  var id = "";
  try { var d = p && p.getVideoData ? p.getVideoData() : null; id = d && d.video_id ? d.video_id : ""; } catch (e) {}
  if (!id) id = VID;
  if (!id || id === thumbId) return;
  thumbId = id;
  $("thumb").style.backgroundImage = "url(https://i.ytimg.com/vi/" + id + "/hqdefault.jpg)";
}
function setMusic(b) {
  music = !!b;
  document.body.classList.toggle("music", music);
  thumbId = "";
  updateThumb();
  setTimeout(fitShield, 50);
}

function onState(e) {
  var s = e.data, playing = (s === 1 || s === 3);
  updateThumb();
  var ic = playing ? ICON_PAUSE : ICON_PLAY;
  $("big").innerHTML = ic;
  if (window.Native && Native.state) Native.state(s);
  if (s === 0) { p.seekTo(0, true); p.pauseVideo(); return; }
  if (s === 2) showOvl(true);                 // रुका हुआ: ▶ दिखता रहे
  else if (s === 1 && !mini) {
    $("big").classList.add("on");             // YouTube का अपना आइकन हमारे बटन के पीछे छिपे
    clearTimeout(ovlTimer);
    ovlTimer = setTimeout(hideOvl, 1500);     // चलना शुरू: थोड़ी देर बाद छिप जाए
  }
}

/* छोटे (मिनी) मोड में नीचे की बार और बटन छिपा देता है */
function setMini(b) {
  mini = b;
  document.body.classList.toggle("mini", b);
  setTimeout(fitShield, 100);
  if (b) { hideOvl(); hideQ(); }
  $("msg").style.fontSize = b ? "9px" : "15px";
  $("msg").style.padding = b ? "4px" : "14px";
}

function onError() {
  if (window.Native) Native.ready();
  var m = $("msg");
  m.style.display = "block";
  m.textContent = "यह वीडियो यहाँ नहीं चल सकता (मालिक ने बाहर चलाने की अनुमति नहीं दी है या वीडियो उपलब्ध नहीं है)।";
}

function tick() {
  if (music) updateThumb();
  if (!p || !p.getDuration) return;
  var d = p.getDuration() || 0, c = p.getCurrentTime() || 0;
  if (!dragging && d > 0) $("seek").value = (c / d) * 1000;
  if (!dragging && Date.now() > flashUntil) $("tm").textContent = fmt(c) + " / " + fmt(d);
}

function toggle() {
  if (!p || !p.getPlayerState) return;
  if (isPlaying()) p.pauseVideo(); else p.playVideo();
}

/* ---------- 10 सेकंड आगे / पीछे ---------- */
function flash(t) {
  $("tm").textContent = t;
  flashUntil = Date.now() + 900;
}
function skip(sec) {
  if (!p || !p.getDuration) return;
  var d = p.getDuration() || 0, c = p.getCurrentTime() || 0;
  var n = Math.max(0, c + sec);
  if (d > 0) n = Math.min(n, d - 0.5);
  p.seekTo(n, true);
  flash(sec > 0 ? "\u00bb +10 सेकंड" : "\u00ab -10 सेकंड");
}

/* ---------- वीडियो पर टैप: एक बार = बटन दिखे/छिपे, डबल टैप = 10 सेकंड आगे/पीछे ---------- */
var lastTap = 0, tapTimer = null;
$("shield").addEventListener("click", function (e) {
  if ($("qmenu").style.display === "block") { hideQ(); return; }
  var now = Date.now();
  var r = this.getBoundingClientRect();
  var x = e.clientX - r.left;
  if (now - lastTap < 320) {
    clearTimeout(tapTimer);
    tapTimer = null;
    lastTap = 0;
    skip(x > r.width / 2 ? 10 : -10);
  } else {
    lastTap = now;
    tapTimer = setTimeout(function () {
      tapTimer = null;
      if ($("big").classList.contains("on")) hideOvl(); else showOvl(false);
    }, 320);
  }
});
$("big").addEventListener("click", function () { toggle(); });
/* नीचे की बार का पहला बटन अब कमेंट का है: टैप -> कमेंट नीचे खुलते हैं, फिर टैप -> बंद */
$("pp").addEventListener("click", function () {
  var id = "";
  try { var d = p && p.getVideoData ? p.getVideoData() : null; id = d && d.video_id ? d.video_id : ""; } catch (e) {}
  if (!id) id = VID;
  if (window.Native && Native.comments) Native.comments(id || "");
});

/* ---------- फुलस्क्रीन में दो उंगली से ज़ूम (और ज़ूम में एक उंगली से खिसकाना) ---------- */
var zs = 1, tx = 0, ty = 0, pinch = null, pan = null;
function applyZoom() {
  var f = $("frame").style;
  f.transformOrigin = "50% 50%";
  f.transform = "translate(" + tx + "px," + ty + "px) scale(" + zs + ")";
}
function clampPan() {
  var fr = $("frame");
  var mx = (zs - 1) * fr.offsetWidth / 2, my = (zs - 1) * fr.offsetHeight / 2;
  tx = Math.max(-mx, Math.min(mx, tx));
  ty = Math.max(-my, Math.min(my, ty));
}
function resetZoom() { zs = 1; tx = 0; ty = 0; pinch = null; pan = null; applyZoom(); }
function tdist(t) {
  var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}
function tmid(t) { return { x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 }; }
function inBriZone(t0) {
  var r = $("shield").getBoundingClientRect();
  return t0.clientX >= r.left + r.width * 0.6;     // दायाँ हिस्सा = ब्राइटनेस
}
function inVolZone(t0) {
  var r = $("shield").getBoundingClientRect();
  return t0.clientX <= r.left + r.width * 0.4;     // बायाँ हिस्सा = आवाज़
}
function inFs() { return document.body.classList.contains("fs"); }
var sh = $("shield");
sh.addEventListener("touchstart", function (e) {
  if (!inFs()) return;
  if (e.touches.length === 2) {
    pan = null;
    pinch = { d: tdist(e.touches), z: zs, m: tmid(e.touches), tx: tx, ty: ty };
    e.preventDefault();
  } else if (e.touches.length === 1 && zs > 1 && !inBriZone(e.touches[0]) && !inVolZone(e.touches[0])) {
    pan = { x: e.touches[0].clientX, y: e.touches[0].clientY, tx: tx, ty: ty };
  }
}, { passive: false });
sh.addEventListener("touchmove", function (e) {
  if (!inFs()) return;
  if (pinch && e.touches.length >= 2) {
    e.preventDefault();
    var m = tmid(e.touches);
    zs = Math.max(1, Math.min(4, pinch.z * tdist(e.touches) / pinch.d));
    tx = pinch.tx + (m.x - pinch.m.x);
    ty = pinch.ty + (m.y - pinch.m.y);
    clampPan(); applyZoom();
  } else if (pan && e.touches.length === 1 && zs > 1) {
    e.preventDefault();
    tx = pan.tx + (e.touches[0].clientX - pan.x);
    ty = pan.ty + (e.touches[0].clientY - pan.y);
    clampPan(); applyZoom();
  }
}, { passive: false });
sh.addEventListener("touchend", function (e) {
  if (e.touches.length < 2) pinch = null;
  if (e.touches.length === 0) pan = null;
  if (zs < 1.05 && zs !== 1) resetZoom();
});


/* ---------- सेटिंग: वीडियो क्वालिटी (720p / 480p / 360p ...) ---------- */
var QN = { hd2160: "2160p", hd1440: "1440p", hd1080: "1080p", hd720: "720p", large: "480p", medium: "360p", small: "240p", tiny: "144p" };
var QORDER = ["hd2160", "hd1440", "hd1080", "hd720", "large", "medium", "small", "tiny"];
var qSel = "auto";
/* YouTube ने क्वालिटी वाले API (setPlaybackQuality / suggestedQuality) बंद कर दिए हैं, इसलिए वह अनदेखा होता है।
   अब YouTube प्लेयर के साइज़ से क्वालिटी चुनता है -> चुनी क्वालिटी के हिसाब से प्लेयर का साइज़ रखकर
   उसे स्क्रीन जितना बड़ा दिखाते हैं (scale)। */
var QW = { hd2160: 3840, hd1440: 2560, hd1080: 1920, hd720: 1280, large: 854, medium: 640, small: 426, tiny: 256 };
function applyQSize() {
  var el = $("player"), fr = $("frame");
  if (!el || !fr) return;
  var st = el.style;
  if (typeof qSel === "undefined" || qSel === "auto" || !QW[qSel]) {
    st.width = ""; st.height = ""; st.top = ""; st.left = ""; st.transform = ""; st.transformOrigin = "";
    return;
  }
  var fw = fr.clientWidth, fh = fr.clientHeight;
  if (!fw || !fh) return;
  var dpr = window.devicePixelRatio || 1;
  var w = Math.max(200, QW[qSel] / dpr);      /* YouTube प्लेयर कम से कम 200px चाहता है */
  var s = fw / w;
  var vh = fh / s;
  var H = Math.max(200, vh + 240 / s);        /* ऊपर-नीचे की 240px पट्टी पहले की तरह छिपी रहे */
  st.width = w + "px"; st.height = H + "px";
  st.left = "0px"; st.top = ((vh - H) / 2) + "px";
  st.transformOrigin = "0 0"; st.transform = "scale(" + s + ")";
}
function hideQ() { $("qmenu").style.display = "none"; }
function openQ() {
  if (!p || !p.getAvailableQualityLevels) return;
  var av = [];
  try { av = p.getAvailableQualityLevels() || []; } catch (e) {}
  var list = QORDER.filter(function (q) { return av.indexOf(q) > -1; });
  if (!list.length) list = ["hd1080", "hd720", "large", "medium", "small", "tiny"];
  var cur = qSel;
  var html = '<div class="h">वीडियो क्वालिटी</div>';
  html += '<div class="q' + (cur === "auto" ? " cur" : "") + '" data-q="auto"><span>ऑटो</span><span>' + (cur === "auto" ? "\u2713" : "") + '</span></div>';
  list.forEach(function (q) {
    html += '<div class="q' + (cur === q ? " cur" : "") + '" data-q="' + q + '"><span>' + QN[q] + '</span><span>' + (cur === q ? "\u2713" : "") + '</span></div>';
  });
  var m = $("qmenu");
  m.innerHTML = html;
  m.style.display = "block";
  showOvl(true);
}
function setQ(q) {
  hideQ();
  if (!p) return;
  qSel = q;
  try { applyQSize(); } catch (e) {}
  var sq = (q === "auto") ? "default" : q;
  try {
    var d = p.getVideoData ? p.getVideoData() : null;
    var t = p.getCurrentTime ? p.getCurrentTime() : 0;
    var wasPlaying = isPlaying();
    if (d && d.video_id) {
      /* YouTube सीधे क्वालिटी बदलने देता नहीं, इसलिए उसी जगह से वही वीडियो नई क्वालिटी में फिर लगाते हैं */
      p.loadVideoById({ videoId: d.video_id, startSeconds: t, suggestedQuality: sq });
      if (!wasPlaying) setTimeout(function () { try { p.pauseVideo(); } catch (e) {} }, 900);
    }
    try { p.setPlaybackQuality(sq); } catch (e) {}
  } catch (e) {}
  flash("\u2699 " + (q === "auto" ? "ऑटो" : QN[q]));
}
$("qbtn").addEventListener("click", function () {
  if ($("qmenu").style.display === "block") hideQ(); else openQ();
});
$("qmenu").addEventListener("click", function (e) {
  var el = e.target.closest ? e.target.closest(".q") : null;
  if (el) setQ(el.getAttribute("data-q"));
});

/* ---------- सीक बार ---------- */
$("seek").addEventListener("input", function () {
  dragging = true;
  var d = (p && p.getDuration) ? p.getDuration() : 0;
  $("tm").textContent = fmt((this.value / 1000) * d) + " / " + fmt(d);
});
$("seek").addEventListener("change", function () {
  var d = (p && p.getDuration) ? p.getDuration() : 0;
  if (d > 0) p.seekTo((this.value / 1000) * d, true);
  dragging = false;
});

/* ---------- ब्राइटनेस ---------- */
try { if (window.Native && Native.getBrightness) $("br").value = Native.getBrightness(); } catch (e) {}
$("br").addEventListener("input", function () {
  if (window.Native && Native.setBrightness) Native.setBrightness(parseInt(this.value, 10));
});


/* ---------- फुलस्क्रीन में दाएँ हिस्से पर उँगली नीचे से ऊपर = ब्राइटनेस बढ़ना (ऊपर से नीचे = घटना) ---------- */
var bg = null, briTimer = null;
function drawBri(v) {
  $("bfill").style.height = v + "%";
  $("bpct").textContent = v + "%";
  $("bri").style.display = "flex";
}
function showBri(v) {                 // उँगली चलते समय: साफ़ दिखे
  drawBri(v);
  $("bri").classList.remove("hint");
  clearTimeout(briTimer);
  briTimer = setTimeout(function () {
    if (document.body.classList.contains("ovl")) hintBri(); else $("bri").style.display = "none";
  }, 900);
}
function hintBri() {                  // बटन दिखते समय: हल्का सा, ताकि पता चले ब्राइटनेस की पट्टी यहाँ है
  if (!inFs()) return;
  drawBri(parseInt($("br").value, 10) || 50);
  $("bri").classList.add("hint");
}
sh.addEventListener("touchstart", function (e) {
  bg = null;
  if (!inFs() || e.touches.length !== 1) return;
  var r = sh.getBoundingClientRect(), t0 = e.touches[0];
  if (!inBriZone(t0)) return;   // सिर्फ़ दायाँ हिस्सा (ज़ूम में भी चलेगा)
  var cur = parseInt($("br").value, 10) || 50;
  try { if (window.Native && Native.getBrightness) cur = Native.getBrightness(); } catch (x) {}
  bg = { y: t0.clientY, x: t0.clientX, b: cur, on: false, h: Math.max(120, r.height) };
}, { passive: true });
sh.addEventListener("touchmove", function (e) {
  if (!bg || e.touches.length !== 1) { bg = null; return; }
  var t0 = e.touches[0], dy = bg.y - t0.clientY, dx = t0.clientX - bg.x;
  if (!bg.on) {
    if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx) * 1.5) bg.on = true; else return;
  }
  e.preventDefault();
  var v = Math.round(Math.max(5, Math.min(100, bg.b + (dy / (bg.h * 0.8)) * 100)));
  $("br").value = v;
  if (window.Native && Native.setBrightness) Native.setBrightness(v);
  showBri(v);
}, { passive: false });
sh.addEventListener("touchend", function () { bg = null; });
sh.addEventListener("touchcancel", function () { bg = null; });

/* ---------- फुलस्क्रीन में बाएँ हिस्से पर उँगली नीचे से ऊपर = वीडियो की आवाज़ बढ़ना (ऊपर से नीचे = घटना) ---------- */
var vg = null, volTimer = null;
function curVol() {
  var v = 100;
  try { if (p && p.getVolume) v = p.isMuted && p.isMuted() ? 0 : p.getVolume(); } catch (x) {}
  return Math.max(0, Math.min(100, Math.round(v)));
}
function drawVol(v) {
  $("vfill").style.height = v + "%";
  $("vpct").textContent = v + "%";
  $("vsp").innerHTML = v === 0 ? "&#128263;" : (v < 50 ? "&#128265;" : "&#128266;");
  $("vol").style.display = "flex";
}
function showVol(v) {
  drawVol(v);
  $("vol").classList.remove("hint");
  clearTimeout(volTimer);
  volTimer = setTimeout(function () {
    if (document.body.classList.contains("ovl")) hintVol(); else $("vol").style.display = "none";
  }, 900);
}
function hintVol() {
  if (!inFs()) return;
  drawVol(curVol());
  $("vol").classList.add("hint");
}
sh.addEventListener("touchstart", function (e) {
  vg = null;
  if (!inFs() || e.touches.length !== 1) return;
  var r = sh.getBoundingClientRect(), t0 = e.touches[0];
  if (!inVolZone(t0)) return;
  vg = { y: t0.clientY, x: t0.clientX, v: curVol(), on: false, h: Math.max(120, r.height) };
}, { passive: true });
sh.addEventListener("touchmove", function (e) {
  if (!vg || e.touches.length !== 1) { vg = null; return; }
  var t0 = e.touches[0], dy = vg.y - t0.clientY, dx = t0.clientX - vg.x;
  if (!vg.on) {
    if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx) * 1.5) vg.on = true; else return;
  }
  e.preventDefault();
  var v = Math.round(Math.max(0, Math.min(100, vg.v + (dy / (vg.h * 0.8)) * 100)));
  try {
    if (p && p.setVolume) {
      if (v > 0 && p.isMuted && p.isMuted()) p.unMute();
      p.setVolume(v);
    }
  } catch (x) {}
  showVol(v);
}, { passive: false });
sh.addEventListener("touchend", function () { vg = null; });
sh.addEventListener("touchcancel", function () { vg = null; });

/* ---------- फुलस्क्रीन ---------- */
/* पूरा स्क्रीन ऐप खुद संभालता है (आड़ा करके, बिना बार) */
function setFs(b) {
  document.body.classList.toggle("fs", b);
  if (!b) resetZoom();
  if (b) showOvl(false); else hideOvl();
  setTimeout(fitShield, 100); setTimeout(fitShield, 500);
}
$("fs").addEventListener("click", function () {
  var on = !document.body.classList.contains("fs");
  if (window.Native && Native.fullscreen) Native.fullscreen(on);
});
</script>
