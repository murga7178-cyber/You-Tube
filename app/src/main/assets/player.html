<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-tap-highlight-color:transparent;font-family:sans-serif}
#wrap{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:#000}
#stage{position:relative;flex:1;min-height:0;background:#000}
#player,#player iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;pointer-events:none}
#shield{position:absolute;top:0;left:0;right:0;bottom:0;z-index:2;touch-action:manipulation}
#big{position:absolute;z-index:3;left:50%;top:50%;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:30px;border:0;padding:0;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .2s}
#big.on{opacity:1;visibility:visible}
#msg{position:absolute;z-index:4;left:16px;right:16px;top:50%;transform:translateY(-50%);text-align:center;color:#fff;font-size:15px;line-height:1.5;display:none;background:rgba(0,0,0,.8);padding:14px;border-radius:12px}
#bar{flex:none;background:#0f0f0f;color:#fff;font-size:13px}
body.fs #bar{display:none;position:absolute;left:0;right:0;bottom:0;z-index:5;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.85))}
body.fs.ovl #bar{display:block}
body.mini #bar{display:none !important}
#r1,#r2{display:flex;align-items:center;gap:8px;padding:0 10px}
#r1{height:52px}
#r2{height:44px}
#pp,#fs{background:none;border:0;color:#fff;font-size:22px;width:38px;height:38px;padding:0;flex:none}
#seek,#br{flex:1;min-width:0;height:30px;margin:0}
#seek{accent-color:#f00}
#br{accent-color:#f5b400}
.t{flex:none;min-width:92px;text-align:center}
.sk{background:#272727;border:0;color:#fff;border-radius:16px;height:32px;padding:0 12px;font-size:13px;flex:none}
.ic{flex:none;font-size:18px}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div id="player"></div>
    <div id="shield"></div>
    <button id="big">&#9654;</button>
    <div id="msg"></div>
  </div>
  <div id="bar">
    <div id="r1">
      <button id="pp">&#9654;</button>
      <span class="t" id="tm">0:00 / 0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0">
      <button id="fs">&#9974;</button>
    </div>
    <div id="r2">
      <button class="sk" id="b10">&#9194; 10</button>
      <span class="ic">&#9728;</span>
      <input id="br" type="range" min="5" max="100" value="50">
      <button class="sk" id="f10">10 &#9193;</button>
    </div>
  </div>
</div>
<script>
var VID = "__ID__", LST = "__LIST__", ST = __START__;
var p = null, dragging = false, mini = false, ovlTimer = null, flashUntil = 0;
function $(i) { return document.getElementById(i); }
function fmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), c = s % 60;
  return (h ? h + ":" + (m < 10 ? "0" : "") : "") + m + ":" + (c < 10 ? "0" : "") + c;
}

var tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

function onYouTubeIframeAPIReady() {
  var v = {
    autoplay: 1, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3,
    rel: 0, modestbranding: 1, playsinline: 1, cc_load_policy: 0,
    origin: "https://videoplayer.app"
  };
  if (ST > 0) v.start = ST;
  if (LST) { v.list = LST; if (!VID) v.listType = "playlist"; }
  var o = {
    host: "https://www.youtube-nocookie.com",
    playerVars: v,
    events: { onReady: onReady, onStateChange: onState, onError: onError }
  };
  if (VID) o.videoId = VID;
  p = new YT.Player("player", o);
}

function onReady() {
  if (window.Native) Native.ready();
  setInterval(tick, 250);
}

/* ---------- वीडियो के ऊपर सिर्फ़ बीच का एक बटन (टैप करने पर) ---------- */
function isPlaying() {
  if (!p || !p.getPlayerState) return false;
  var s = p.getPlayerState();
  return s === 1 || s === 3;
}
function showOvl(sticky) {
  if (mini) return;
  $("big").classList.add("on");
  document.body.classList.add("ovl");
  clearTimeout(ovlTimer);
  if (!sticky && isPlaying()) ovlTimer = setTimeout(hideOvl, 3000);
}
function hideOvl() {
  clearTimeout(ovlTimer);
  $("big").classList.remove("on");
  document.body.classList.remove("ovl");
}

function onState(e) {
  var s = e.data, playing = (s === 1 || s === 3);
  var ic = playing ? "&#9208;" : "&#9654;";
  $("pp").innerHTML = ic;
  $("big").innerHTML = ic;
  if (window.Native && Native.state) Native.state(s);
  if (s === 0) { p.seekTo(0, true); p.pauseVideo(); return; }
  if (s === 2) showOvl(true);                 // रुका हुआ: ▶ दिखता रहे
  else if (s === 1 && $("big").classList.contains("on")) {
    clearTimeout(ovlTimer);
    ovlTimer = setTimeout(hideOvl, 1200);     // चलना शुरू: जल्दी छिप जाए
  }
}

/* छोटे (मिनी) मोड में नीचे की बार और बटन छिपा देता है */
function setMini(b) {
  mini = b;
  document.body.classList.toggle("mini", b);
  if (b) hideOvl();
  $("msg").style.fontSize = b ? "9px" : "15px";
  $("msg").style.padding = b ? "4px" : "14px";
}

function onError() {
  if (window.Native) Native.ready();
  var m = $("msg");
  m.style.display = "block";
  m.textContent = "यह वीडियो यहाँ नहीं चल सकता (मालिक ने बाहर चलाने की अनुमति नहीं दी है या वीडियो उपलब्ध नहीं है)।";
}

function tick() {
  if (!p || !p.getDuration) return;
  var d = p.getDuration() || 0, c = p.getCurrentTime() || 0;
  if (!dragging && d > 0) $("seek").value = (c / d) * 1000;
  if (!dragging && Date.now() > flashUntil) $("tm").textContent = fmt(c) + " / " + fmt(d);
}

function toggle() {
  if (!p || !p.getPlayerState) return;
  if (isPlaying()) p.pauseVideo(); else p.playVideo();
}

/* ---------- 10 सेकंड आगे / पीछे ---------- */
function flash(t) {
  $("tm").textContent = t;
  flashUntil = Date.now() + 900;
}
function skip(sec) {
  if (!p || !p.getDuration) return;
  var d = p.getDuration() || 0, c = p.getCurrentTime() || 0;
  var n = Math.max(0, c + sec);
  if (d > 0) n = Math.min(n, d - 0.5);
  p.seekTo(n, true);
  flash(sec > 0 ? "⏩ +10 सेकंड" : "⏪ -10 सेकंड");
}
$("b10").addEventListener("click", function () { skip(-10); });
$("f10").addEventListener("click", function () { skip(10); });

/* ---------- वीडियो पर टैप: एक बार = बटन दिखे/छिपे, डबल टैप = 10 सेकंड आगे/पीछे ---------- */
var lastTap = 0, tapTimer = null;
$("shield").addEventListener("click", function (e) {
  var now = Date.now();
  var r = this.getBoundingClientRect();
  var x = e.clientX - r.left;
  if (now - lastTap < 320) {
    clearTimeout(tapTimer);
    tapTimer = null;
    lastTap = 0;
    skip(x > r.width / 2 ? 10 : -10);
  } else {
    lastTap = now;
    tapTimer = setTimeout(function () {
      tapTimer = null;
      if ($("big").classList.contains("on")) hideOvl(); else showOvl(false);
    }, 320);
  }
});
$("big").addEventListener("click", function () { toggle(); });
$("pp").addEventListener("click", toggle);

/* ---------- सीक बार ---------- */
$("seek").addEventListener("input", function () {
  dragging = true;
  var d = (p && p.getDuration) ? p.getDuration() : 0;
  $("tm").textContent = fmt((this.value / 1000) * d) + " / " + fmt(d);
});
$("seek").addEventListener("change", function () {
  var d = (p && p.getDuration) ? p.getDuration() : 0;
  if (d > 0) p.seekTo((this.value / 1000) * d, true);
  dragging = false;
});

/* ---------- ब्राइटनेस ---------- */
try { if (window.Native && Native.getBrightness) $("br").value = Native.getBrightness(); } catch (e) {}
$("br").addEventListener("input", function () {
  if (window.Native && Native.setBrightness) Native.setBrightness(parseInt(this.value, 10));
});

/* ---------- फुलस्क्रीन ---------- */
/* पूरा स्क्रीन ऐप खुद संभालता है (आड़ा करके, बिना बार) */
function setFs(b) {
  document.body.classList.toggle("fs", b);
  if (b) showOvl(false); else hideOvl();
}
$("fs").addEventListener("click", function () {
  var on = !document.body.classList.contains("fs");
  if (window.Native && Native.fullscreen) Native.fullscreen(on);
});
</script>
</body>
</html>
