<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-tap-highlight-color:transparent;font-family:sans-serif}
#wrap{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:#000}
#stage{position:relative;flex:1;min-height:0;background:#000}
#frame{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;z-index:1}
#player,#player iframe{position:absolute;left:0;top:-120px;width:100%;height:calc(100% + 240px);border:0;pointer-events:none}
#shield{position:absolute;left:0;top:0;width:100%;height:100%;z-index:2;touch-action:none}
#big{position:absolute;z-index:3;left:50%;top:50%;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:30px;border:0;padding:0;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .2s}
#big.on{opacity:1;visibility:visible}
#msg{position:absolute;z-index:4;left:16px;right:16px;top:50%;transform:translateY(-50%);text-align:center;color:#fff;font-size:15px;line-height:1.5;display:none;background:rgba(0,0,0,.8);padding:14px;border-radius:12px}
#bar{flex:none;background:#0f0f0f;color:#fff;font-size:13px}
body.fs #bar{display:none;position:absolute;left:0;right:0;bottom:0;z-index:5;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.85))}
body.fs.ovl #bar{display:block}
body.mini #bar{display:none !important}
#r1,#r2{display:flex;align-items:center;gap:8px;padding:0 10px}
#r1{height:52px}
#r2{height:44px;justify-content:center;gap:16px}
#pp,#fs{background:none;border:0;color:#fff;font-size:22px;width:38px;height:38px;padding:0;flex:none}
#seek,#br{flex:1;min-width:0;height:30px;margin:0}
#seek{accent-color:#f00}
#bri{position:absolute;z-index:7;left:50%;top:16px;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;font-size:15px;padding:6px 14px;border-radius:16px;display:none}
#brw{position:absolute;right:12px;top:50%;width:40px;height:180px;margin-top:-90px;z-index:6;display:none}
body.fs.ovl #brw{display:block}
#br{position:absolute;width:160px;height:30px;left:-60px;top:75px;margin:0;transform:rotate(-90deg);accent-color:#fff}
.t{flex:none;min-width:92px;text-align:center}
.sk{background:#272727;border:0;color:#fff;border-radius:16px;height:32px;padding:0 12px;font-size:13px;flex:none}
.ic{flex:none;font-size:18px}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div id="frame"><div id="player"></div></div>
    <div id="shield"></div>
    <button id="big"><svg viewBox="0 0 24 24" width="1em" height="1em"><path fill="#fff" d="M8 5v14l11-7z"/></svg></button>
    <div id="msg"></div>
    <div id="bri"></div>
    <div id="brw"><input id="br" type="range" min="5" max="100" value="50"></div>
  </div>
  <div id="bar">
    <div id="r1">
      <button id="pp"><svg viewBox="0 0 24 24" width="1em" height="1em"><path fill="#fff" d="M8 5v14l11-7z"/></svg></button>
      <span class="t" id="tm">0:00 / 0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0">
      <button id="fs"><svg viewBox="0 0 24 24" width="1em" height="1em"><path fill="#fff" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
    </div>
  </div>
</div>
<script>
var VID = "__ID__", LST = "__LIST__", ST = __START__;
var ICON_PLAY = '<svg viewBox="0 0 24 24" width="1em" height="1em"><path fill="#fff" d="M8 5v14l11-7z"/></svg>', ICON_PAUSE = '<svg viewBox="0 0 24 24" width="1em" height="1em"><path fill="#fff" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
var p = null, dragging = false, mini = false, ovlTimer = null, flashUntil = 0;
function $(i) { return document.getElementById(i); }
function fmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), c = s % 60;
  return (h ? h + ":" + (m < 10 ? "0" : "") : "") + m + ":" + (c < 10 ? "0" : "") + c;
}

var tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

function onYouTubeIframeAPIReady() {
  var v = {
    autoplay: 1, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3,
    rel: 0, modestbranding: 1, playsinline: 1, cc_load_policy: 0,
    origin: "https://videoplayer.app"
  };
  if (ST > 0) v.start = ST;
  /* सिर्फ़ वही एक वीडियो चले: प्लेलिस्ट के आगे/पीछे वाले बटन न आएँ */
  if (LST && !VID) { v.list = LST; v.listType = "playlist"; }
  var o = {
    host: "https://www.youtube-nocookie.com",
    playerVars: v,
    events: { onReady: onReady, onStateChange: onState, onError: onError }
  };
  if (VID) o.videoId = VID;
  p = new YT.Player("player", o);
}

/* शील्ड को असली 16:9 वीडियो फ्रेम जितना बनाता है (काली पट्टी पर टैप नहीं चलेगा) */
function fitShield() {
  var st = $("stage"), W = st.clientWidth, H = st.clientHeight;
  if (!W || !H) return;
  var w = W, h = W * 9 / 16;
  if (h > H) { h = H; w = H * 16 / 9; }
  var s = $("shield").style;
  s.width = w + "px"; s.height = h + "px";
  s.left = ((W - w) / 2) + "px"; s.top = ((H - h) / 2) + "px";
  var f = $("frame").style;
  f.width = w + "px"; f.height = h + "px";
  f.left = s.left; f.top = s.top;
}
window.addEventListener("resize", function () { fitShield(); setTimeout(fitShield, 300); });
window.addEventListener("load", fitShield);
fitShield();

function onReady() {
  fitShield();
  if (window.Native) Native.ready();
  setInterval(tick, 250);
}

/* ---------- वीडियो के ऊपर सिर्फ़ बीच का एक बटन (टैप करने पर) ---------- */
function isPlaying() {
  if (!p || !p.getPlayerState) return false;
  var s = p.getPlayerState();
  return s === 1 || s === 3;
}
function showOvl(sticky) {
  if (mini) return;
  $("big").classList.add("on");
  document.body.classList.add("ovl");
  clearTimeout(ovlTimer);
  if (!sticky && isPlaying()) ovlTimer = setTimeout(hideOvl, 3000);
}
function hideOvl() {
  clearTimeout(ovlTimer);
  $("big").classList.remove("on");
  document.body.classList.remove("ovl");
}

function onState(e) {
  var s = e.data, playing = (s === 1 || s === 3);
  var ic = playing ? ICON_PAUSE : ICON_PLAY;
  $("pp").innerHTML = ic;
  $("big").innerHTML = ic;
  if (window.Native && Native.state) Native.state(s);
  if (s === 0) { p.seekTo(0, true); p.pauseVideo(); return; }
  if (s === 2) showOvl(true);                 // रुका हुआ: ▶ दिखता रहे
  else if (s === 1 && $("big").classList.contains("on")) {
    clearTimeout(ovlTimer);
    ovlTimer = setTimeout(hideOvl, 1200);     // चलना शुरू: जल्दी छिप जाए
  }
}

/* छोटे (मिनी) मोड में नीचे की बार और बटन छिपा देता है */
function setMini(b) {
  mini = b;
  document.body.classList.toggle("mini", b);
  setTimeout(fitShield, 100);
  if (b) hideOvl();
  $("msg").style.fontSize = b ? "9px" : "15px";
  $("msg").style.padding = b ? "4px" : "14px";
}

function onError() {
  if (window.Native) Native.ready();
  var m = $("msg");
  m.style.display = "block";
  m.textContent = "यह वीडियो यहाँ नहीं चल सकता (मालिक ने बाहर चलाने की अनुमति नहीं दी है या वीडियो उपलब्ध नहीं है)।";
}

function tick() {
  if (!p || !p.getDuration) return;
  var d = p.getDuration() || 0, c = p.getCurrentTime() || 0;
  if (!dragging && d > 0) $("seek").value = (c / d) * 1000;
  if (!dragging && Date.now() > flashUntil) $("tm").textContent = fmt(c) + " / " + fmt(d);
}

function toggle() {
  if (!p || !p.getPlayerState) return;
  if (isPlaying()) p.pauseVideo(); else p.playVideo();
}

/* ---------- 10 सेकंड आगे / पीछे ---------- */
function flash(t) {
  $("tm").textContent = t;
  flashUntil = Date.now() + 900;
}
function skip(sec) {
  if (!p || !p.getDuration) return;
  var d = p.getDuration() || 0, c = p.getCurrentTime() || 0;
  var n = Math.max(0, c + sec);
  if (d > 0) n = Math.min(n, d - 0.5);
  p.seekTo(n, true);
  flash(sec > 0 ? "\u00bb +10 सेकंड" : "\u00ab -10 सेकंड");
}

/* ---------- वीडियो पर टैप: एक बार = बटन दिखे/छिपे, डबल टैप = 10 सेकंड आगे/पीछे ---------- */
var lastTap = 0, tapTimer = null;
$("shield").addEventListener("click", function (e) {
  var now = Date.now();
  var r = this.getBoundingClientRect();
  var x = e.clientX - r.left;
  if (now - lastTap < 320) {
    clearTimeout(tapTimer);
    tapTimer = null;
    lastTap = 0;
    skip(x > r.width / 2 ? 10 : -10);
  } else {
    lastTap = now;
    tapTimer = setTimeout(function () {
      tapTimer = null;
      if ($("big").classList.contains("on")) hideOvl(); else showOvl(false);
    }, 320);
  }
});
$("big").addEventListener("click", function () { toggle(); });
$("pp").addEventListener("click", toggle);

/* ---------- फुलस्क्रीन में दो उंगली से ज़ूम (और ज़ूम में एक उंगली से खिसकाना) ---------- */
var zs = 1, tx = 0, ty = 0, pinch = null, pan = null;
function applyZoom() {
  var f = $("frame").style;
  f.transformOrigin = "50% 50%";
  f.transform = "translate(" + tx + "px," + ty + "px) scale(" + zs + ")";
}
function clampPan() {
  var fr = $("frame");
  var mx = (zs - 1) * fr.offsetWidth / 2, my = (zs - 1) * fr.offsetHeight / 2;
  tx = Math.max(-mx, Math.min(mx, tx));
  ty = Math.max(-my, Math.min(my, ty));
}
function resetZoom() { zs = 1; tx = 0; ty = 0; pinch = null; pan = null; applyZoom(); }
function tdist(t) {
  var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}
function tmid(t) { return { x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 }; }
function inFs() { return document.body.classList.contains("fs"); }
var sh = $("shield");
sh.addEventListener("touchstart", function (e) {
  if (!inFs()) return;
  if (e.touches.length === 2) {
    pan = null;
    pinch = { d: tdist(e.touches), z: zs, m: tmid(e.touches), tx: tx, ty: ty };
    e.preventDefault();
  } else if (e.touches.length === 1 && zs > 1) {
    pan = { x: e.touches[0].clientX, y: e.touches[0].clientY, tx: tx, ty: ty };
  }
}, { passive: false });
sh.addEventListener("touchmove", function (e) {
  if (!inFs()) return;
  if (pinch && e.touches.length >= 2) {
    e.preventDefault();
    var m = tmid(e.touches);
    zs = Math.max(1, Math.min(4, pinch.z * tdist(e.touches) / pinch.d));
    tx = pinch.tx + (m.x - pinch.m.x);
    ty = pinch.ty + (m.y - pinch.m.y);
    clampPan(); applyZoom();
  } else if (pan && e.touches.length === 1 && zs > 1) {
    e.preventDefault();
    tx = pan.tx + (e.touches[0].clientX - pan.x);
    ty = pan.ty + (e.touches[0].clientY - pan.y);
    clampPan(); applyZoom();
  }
}, { passive: false });
sh.addEventListener("touchend", function (e) {
  if (e.touches.length < 2) pinch = null;
  if (e.touches.length === 0) pan = null;
  if (zs < 1.05 && zs !== 1) resetZoom();
});

/* ---------- सीक बार ---------- */
$("seek").addEventListener("input", function () {
  dragging = true;
  var d = (p && p.getDuration) ? p.getDuration() : 0;
  $("tm").textContent = fmt((this.value / 1000) * d) + " / " + fmt(d);
});
$("seek").addEventListener("change", function () {
  var d = (p && p.getDuration) ? p.getDuration() : 0;
  if (d > 0) p.seekTo((this.value / 1000) * d, true);
  dragging = false;
});

/* ---------- ब्राइटनेस ---------- */
try { if (window.Native && Native.getBrightness) $("br").value = Native.getBrightness(); } catch (e) {}
$("br").addEventListener("input", function () {
  if (window.Native && Native.setBrightness) Native.setBrightness(parseInt(this.value, 10));
});


/* ---------- फुलस्क्रीन में दाएँ हिस्से पर उँगली नीचे से ऊपर = ब्राइटनेस बढ़ना (ऊपर से नीचे = घटना) ---------- */
var bg = null, briTimer = null;
function showBri(v) {
  var b = $("bri");
  b.textContent = "\u2600 " + v + "%";
  b.style.display = "block";
  clearTimeout(briTimer);
  briTimer = setTimeout(function () { b.style.display = "none"; }, 800);
}
sh.addEventListener("touchstart", function (e) {
  bg = null;
  if (!inFs() || e.touches.length !== 1 || zs > 1.01) return;
  var r = sh.getBoundingClientRect(), t0 = e.touches[0];
  if (t0.clientX < r.left + r.width * 0.6) return;   // सिर्फ़ दायाँ हिस्सा
  var cur = parseInt($("br").value, 10) || 50;
  try { if (window.Native && Native.getBrightness) cur = Native.getBrightness(); } catch (x) {}
  bg = { y: t0.clientY, x: t0.clientX, b: cur, on: false, h: Math.max(120, r.height) };
}, { passive: true });
sh.addEventListener("touchmove", function (e) {
  if (!bg || e.touches.length !== 1) { bg = null; return; }
  var t0 = e.touches[0], dy = bg.y - t0.clientY, dx = t0.clientX - bg.x;
  if (!bg.on) {
    if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx) * 1.5) bg.on = true; else return;
  }
  e.preventDefault();
  var v = Math.round(Math.max(5, Math.min(100, bg.b + (dy / (bg.h * 0.8)) * 100)));
  $("br").value = v;
  if (window.Native && Native.setBrightness) Native.setBrightness(v);
  showBri(v);
}, { passive: false });
sh.addEventListener("touchend", function () { bg = null; });
sh.addEventListener("touchcancel", function () { bg = null; });

/* ---------- फुलस्क्रीन ---------- */
/* पूरा स्क्रीन ऐप खुद संभालता है (आड़ा करके, बिना बार) */
function setFs(b) {
  document.body.classList.toggle("fs", b);
  if (!b) resetZoom();
  if (b) showOvl(false); else hideOvl();
  setTimeout(fitShield, 100); setTimeout(fitShield, 500);
}
$("fs").addEventListener("click", function () {
  var on = !document.body.classList.contains("fs");
  if (window.Native && Native.fullscreen) Native.fullscreen(on);
});
</script>
</body>
</html>
